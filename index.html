<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Война и Мир — Судьба человека</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
      cursor: default;
    }

    /* Пиксельная рамка */
    canvas::after {
      content: '';
      position: fixed;
      inset: 10px;
      pointer-events: none;
      border: 3px solid #d4a73c;
    }

    /* Цитата внизу */
    .quote {
      position: fixed;
      bottom: 15px;
      left: 0;
      right: 0;
      text-align: center;
      color: #8a7a5a;
      font-size: 9px;
      font-family: monospace;
      background: rgba(0,0,0,0.6);
      padding: 5px;
      z-index: 100;
      letter-spacing: 1px;
    }

    /* ===== МОДАЛЬНОЕ ОКНО (НОВЫЙ ДИЗАЙН) ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
    }

    .modal-content {
      width: 480px;
      max-width: 85%;
      background: #0d0a05;
      border-left: 6px solid #8b2a1a;
      border-right: 1px solid #2a2a20;
      border-top: 1px solid #2a2a20;
      border-bottom: 1px solid #2a2a20;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      padding: 0;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      background: #0a0804;
      padding: 18px 20px;
      border-bottom: 1px solid #2a2a20;
    }

    .modal-name {
      font-size: 20px;
      color: #c99a2e;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .modal-year {
      font-size: 11px;
      color: #6a5a3a;
      margin-top: 6px;
    }

    .modal-body {
      padding: 20px;
    }

    .info-line {
      margin-bottom: 18px;
      border-bottom: 1px dashed #1f1f18;
      padding-bottom: 12px;
    }

    .info-label {
      color: #8b2a1a;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .info-value {
      color: #d8c89a;
      font-size: 13px;
      line-height: 1.5;
    }

    .close-btn {
      background: #0a0804;
      border: none;
      border-top: 1px solid #2a2a20;
      color: #8b2a1a;
      padding: 12px 20px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      width: 100%;
      transition: 0.2s;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .close-btn:hover {
      background: #1f1a10;
      color: #c99a2e;
    }
  </style>
</head>
<body>

<canvas id="mapCanvas"></canvas>

<div class="quote">«Надо жить, надо любить, надо верить...» — Лев Толстой</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-year" id="modalYear"></div>
    </div>
    <div class="modal-body">
      <div class="info-line">
        <div class="info-label">⚔ СТАТУС</div>
        <div class="info-value" id="modalStatus"></div>
      </div>
      <div class="info-line">
        <div class="info-label">📅 ДАТЫ</div>
        <div class="info-value" id="modalDates"></div>
      </div>
      <div class="info-line">
        <div class="info-label">📍 МЕСТО</div>
        <div class="info-value" id="modalDeathPlace"></div>
      </div>
      <div class="info-line">
        <div class="info-label">📖 БИОГРАФИЯ</div>
        <div class="info-value" id="modalBio"></div>
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">ЗАКРЫТЬ</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const mapImage = new Image();
  mapImage.src = 'map.jpg';

  let ORIGINAL_WIDTH = 1;
  let ORIGINAL_HEIGHT = 1;
  let drawWidth = 0;
  let drawHeight = 0;
  let offsetX = 0;
  let offsetY = 0;

  let hoveredHero = null;
  let time = 0;
  let mouseX = 0;
  let mouseY = 0;

  const heroes = [
    {
      name: 'Анатоль Курагин',
      birthYear: 'ок. 1780',
      deathYear: '1812',
      deathPlace: 'После Бородинского сражения',
      x: 1004, y: 414,
      color: '#d13a2f',
      bio: 'Красавец и повеса, брат Элен. Участвовал в Бородинском сражении, где был тяжело ранен. Ему ампутировали ногу, но спасти не смогли. Умер от гангрены.'
    },
    {
      name: 'Петя Ростов',
      birthYear: '1797',
      deathYear: '1812',
      deathPlace: 'Под Вязьмой',
      x: 965, y: 482,
      color: '#ff5555',
      bio: 'Младший сын графа Ростова. В 15 лет ушёл на войну. Погиб в партизанском бою, бросившись вперёд лошади.'
    },
    {
      name: 'Князь Николай Болконский',
      birthYear: '1736',
      deathYear: '1812',
      deathPlace: 'Лысые Горы',
      x: 1270, y: 235,
      color: '#992222',
      bio: 'Старый князь, отец Андрея. При приближении французов отказался бежать. Был разбит параличом и умер в своём имении.'
    },
    {
      name: 'Элен Безухова',
      birthYear: '1785',
      deathYear: '1812',
      deathPlace: 'Санкт-Петербург',
      x: 848, y: 127,
      color: '#e6b85c',
      bio: 'Светская красавица, жена Пьера. Умерла при загадочных обстоятельствах.'
    },
    {
      name: 'Михаил Кутузов',
      birthYear: '1745',
      deathYear: '1813',
      deathPlace: 'Бунцлау, Силезия',
      x: 481, y: 551,
      color: '#c9a227',
      bio: 'Главнокомандующий русской армией. Сдал Москву, чтобы сохранить армию. Умер через год после изгнания Наполеона.'
    },
    {
      name: 'Наполеон Бонапарт',
      birthYear: '1769',
      deathYear: '1821',
      deathPlace: 'Остров Святой Елены',
      x: 68, y: 630,
      color: '#555',
      bio: 'Император Франции. Вторгся в Россию, занял пустую Москву, позорно бежал. Умер в ссылке.'
    }
  ];

  function toCanvasX(x) { return offsetX + (x / ORIGINAL_WIDTH) * drawWidth; }
  function toCanvasY(y) { return offsetY + (y / ORIGINAL_HEIGHT) * drawHeight; }

  function drawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (!mapImage.complete || mapImage.naturalWidth === 0) {
      ctx.fillStyle = '#ff6666';
      ctx.font = '16px monospace';
      ctx.fillText('ОШИБКА: Файл map.jpg не найден!', canvas.width/2 - 200, canvas.height/2);
      return;
    }
    
    const imageRatio = ORIGINAL_WIDTH / ORIGINAL_HEIGHT;
    const canvasRatio = canvas.width / canvas.height;

    if (canvasRatio > imageRatio) {
      drawHeight = canvas.height;
      drawWidth = drawHeight * imageRatio;
    } else {
      drawWidth = canvas.width;
      drawHeight = drawWidth / imageRatio;
    }

    offsetX = (canvas.width - drawWidth) / 2;
    offsetY = (canvas.height - drawHeight) / 2;

    ctx.drawImage(mapImage, offsetX, offsetY, drawWidth, drawHeight);
    drawHeroes();
  }

  function drawHeroes() {
    heroes.forEach(hero => {
      const x = toCanvasX(hero.x);
      const y = toCanvasY(hero.y);
      let scale = Math.max(2, drawWidth / ORIGINAL_WIDTH * 4);
      
      let isHovered = (hoveredHero === hero);
      
      if (isHovered) {
        scale = scale * 1.15;
        ctx.shadowColor = '#ffcc66';
        ctx.shadowBlur = 15;
      } else {
        ctx.shadowColor = '#ffcc66';
        ctx.shadowBlur = 8;
      }

      ctx.fillStyle = '#ffd39a';
      ctx.fillRect(x - scale, y - scale * 4, scale * 2, scale * 2);
      
      ctx.fillStyle = hero.color;
      ctx.fillRect(x - scale * 1.5, y - scale * 2, scale * 3, scale * 3);
      
      ctx.fillStyle = '#700';
      ctx.fillRect(x - scale * 2, y - scale * 1.5, scale * 4, scale);
      
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(x + scale * 2, y - scale * 2, scale, scale * 4);
      
      ctx.shadowBlur = 0;
      
      let fontSize = 13;
      let nameOffsetX = 18;
      let nameOffsetY = -10;
      
      ctx.font = `${fontSize}px 'Courier New', monospace`;
      ctx.fillStyle = '#000';
      ctx.fillText(hero.name, x + nameOffsetX, y + nameOffsetY);
      ctx.fillStyle = '#ffe2a0';
      ctx.fillText(hero.name, x + nameOffsetX - 1, y + nameOffsetY - 1);
    });
  }

  function updateCursor() {
    let isOverHero = false;
    heroes.forEach(hero => {
      const x = toCanvasX(hero.x);
      const y = toCanvasY(hero.y);
      if (mouseX >= x - 30 && mouseX <= x + 30 && mouseY >= y - 35 && mouseY <= y + 35) {
        isOverHero = true;
      }
    });
    canvas.style.cursor = isOverHero ? 'pointer' : 'default';
  }

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    
    let newHovered = null;
    heroes.forEach(hero => {
      const x = toCanvasX(hero.x);
      const y = toCanvasY(hero.y);
      if (mouseX >= x - 30 && mouseX <= x + 30 && mouseY >= y - 35 && mouseY <= y + 35) {
        newHovered = hero;
      }
    });
    hoveredHero = newHovered;
    updateCursor();
  });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    heroes.forEach(hero => {
      const x = toCanvasX(hero.x);
      const y = toCanvasY(hero.y);
      if (mx >= x - 30 && mx <= x + 30 && my >= y - 35 && my <= y + 35) {
        openModal(hero);
      }
    });
  });

  function openModal(hero) {
    document.getElementById('modalName').textContent = hero.name;
    document.getElementById('modalYear').textContent = hero.deathYear ? `† ${hero.deathYear}` : '';
    
    let status = hero.deathYear ? 'ПОГИБ / УМЕР' : 'ВЫЖИЛ';
    document.getElementById('modalStatus').textContent = status;
    document.getElementById('modalDates').textContent = `${hero.birthYear} — ${hero.deathYear || '...'}`;
    document.getElementById('modalDeathPlace').textContent = hero.deathPlace || '—';
    document.getElementById('modalBio').textContent = hero.bio;
    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  function animate() {
    time += 0.05;
    drawMap();
    requestAnimationFrame(animate);
  }

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawMap();
  }

  window.addEventListener('resize', resizeCanvas);

  mapImage.onload = () => {
    ORIGINAL_WIDTH = mapImage.width;
    ORIGINAL_HEIGHT = mapImage.height;
    resizeCanvas();
    animate();
  };

  mapImage.onerror = () => {
    resizeCanvas();
  };

  resizeCanvas();
</script>

</body>
</html>
